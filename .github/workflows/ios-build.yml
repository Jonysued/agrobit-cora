name: Lucient iOS build

on:
  workflow_dispatch:
  pull_request:
    paths: ['ios/**', 'src/**', 'scripts/**', 'package*.json', 'capacitor.config.ts', '.github/workflows/ios-build.yml']
  push:
    branches: [main]
    paths: ['ios/**', 'src/**', 'scripts/**', 'package*.json', 'capacitor.config.ts', '.github/workflows/ios-build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify web and offline behavior
        run: npm run typecheck && npm run lint && npm test
      - name: Bundle all app screens locally
        run: npm run ios:sync && node scripts/verify-ios-bundle.mjs
      - name: Compile iPhone and iPad app for simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/LucientSimulator" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Compile device archive
        run: |
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lucient.xcarchive" \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: Lucient-iOS-unsigned
          path: ${{ runner.temp }}/Lucient.xcarchive
          retention-days: 14
