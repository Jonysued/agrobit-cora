name: Import Lucient Android
on:
  push:
    branches: [feat/android-ready]
    paths: [lucient-android-source.zip]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Import reviewed Android source
        run: |
          unzip -o lucient-android-source.zip
          rm lucient-android-source.zip
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run android:sync
      - name: Preserve Android source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android package.json package-lock.json ANDROID.md lucient-android-source.zip
          git commit -m 'Add Android 1.0.3 with current offline and irrigation features'
          git push
