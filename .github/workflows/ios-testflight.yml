name: Lucient iOS TestFlight

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-26
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_PROFILE_NAME: Lucient App Store
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify required configuration
        run: |
          for name in APPLE_TEAM_ID VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_API_KEY_P8_BASE64; do
            if [[ -z "${!name}" ]]; then echo "Missing $name" >&2; exit 1; fi
          done
      - name: Build web assets and sync iOS
        run: npm run typecheck && npm run lint && npm test && npm run ios:sync && node scripts/verify-ios-bundle.mjs
      - name: Install signing assets
        env:
          RUNNER_TEMP_KEYCHAIN: ${{ runner.temp }}/lucient-signing.keychain-db
        run: |
          set -euo pipefail
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/lucient.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/lucient.mobileprovision"
          # Apple's keychain cannot import the newer PBES2 encryption used by
          # OpenSSL 3 when the PKCS#12 file is exported with its defaults.
          brew_openssl="$(brew --prefix openssl@3)/bin/openssl"
          "$brew_openssl" pkcs12 -in "$RUNNER_TEMP/lucient.p12" \
            -passin env:IOS_CERTIFICATE_PASSWORD -nodes -out "$RUNNER_TEMP/signing.pem"
          "$brew_openssl" pkcs12 -export -legacy -in "$RUNNER_TEMP/signing.pem" \
            -out "$RUNNER_TEMP/lucient-legacy.p12" -passout env:IOS_CERTIFICATE_PASSWORD
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/.appstoreconnect/private_keys"
          profile_plist="$RUNNER_TEMP/lucient-profile.plist"
          security cms -D -i "$RUNNER_TEMP/lucient.mobileprovision" > "$profile_plist"
          app_identifier=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$profile_plist")
          test "$app_identifier" = "$APPLE_TEAM_ID.com.lucient.app"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/lucient.mobileprovision")")
          cp "$RUNNER_TEMP/lucient.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          printf '%s' "$APPSTORE_API_KEY_P8_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          security create-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$RUNNER_TEMP_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP_KEYCHAIN"
          security unlock-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$RUNNER_TEMP_KEYCHAIN"
          security import "$RUNNER_TEMP/lucient-legacy.p12" -k "$RUNNER_TEMP_KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$RUNNER_TEMP_KEYCHAIN"
          security default-keychain -d user -s "$RUNNER_TEMP_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_CERTIFICATE_PASSWORD" "$RUNNER_TEMP_KEYCHAIN"
      - name: Archive iOS app
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lucient.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: Export signed IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>com.lucient.app</key><string>$IOS_PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lucient.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP/ios-export/App.ipa" \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: Lucient-iOS-signed
          path: ${{ runner.temp }}/ios-export/App.ipa
          retention-days: 14
